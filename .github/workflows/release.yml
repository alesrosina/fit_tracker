name: Build, sign and release

on:
  push:
    tags:
      - 'v*'

env:
  APP_ID: fit_tracker

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install JS dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install PHP dependencies (no dev)
        run: composer install --no-dev --optimize-autoloader

      - name: Write signing key and certificate
        run: |
          echo "${{ secrets.APP_PRIVATE_KEY }}" > /tmp/${{ env.APP_ID }}.key
          echo "${{ secrets.APP_CERTIFICATE }}" > /tmp/${{ env.APP_ID }}.crt

      # Stage exactly the files that ship. Signing and the tarball both use this
      # directory, so signature.json lists only files that are actually in the archive.
      - name: Stage release files
        run: |
          STAGE=/tmp/build/${{ env.APP_ID }}
          rm -rf /tmp/build && mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.gitignore' \
            --exclude='.l10nignore' \
            --exclude='node_modules/' \
            --exclude='src/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='webpack.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='appinfo/signature.json' \
            ./ "$STAGE/"
          echo "Staged $(find "$STAGE" -type f | wc -l) files"

      # Nextcloud's IntegrityCheck\Checker verifies with phpseclib using
      # RSA-PSS, hash SHA-1, MGF1 SHA-512, salt length 0, over json_encode(ksort(hashes)).
      # PHP's openssl_sign() can't do PSS, so PHP builds the payload and openssl signs it.
      - name: Sign the app (code integrity)
        run: |
          STAGE=/tmp/build/${{ env.APP_ID }}
          php -r '
            $appPath = $argv[1];
            $hashes  = [];
            $it = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($appPath, FilesystemIterator::SKIP_DOTS)
            );
            foreach ($it as $f) {
              if (!$f->isFile()) continue;
              $rel = substr($f->getPathname(), strlen($appPath) + 1);
              if ($rel === "appinfo/signature.json") continue;
              $hashes[$rel] = hash_file("sha512", $f->getPathname());
            }
            ksort($hashes);
            file_put_contents("/tmp/payload.json", json_encode($hashes));
          ' "$STAGE"

          openssl dgst -sha1 -sign /tmp/${{ env.APP_ID }}.key \
            -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:0 -sigopt rsa_mgf1_md:sha512 \
            -out /tmp/payload.sig /tmp/payload.json

          # Sanity check with the certificate's public key, same parameters.
          openssl x509 -in /tmp/${{ env.APP_ID }}.crt -pubkey -noout > /tmp/pub.pem
          openssl dgst -sha1 -verify /tmp/pub.pem \
            -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:0 -sigopt rsa_mgf1_md:sha512 \
            -signature /tmp/payload.sig /tmp/payload.json

          php -r '
            file_put_contents($argv[1] . "/appinfo/signature.json", json_encode([
              "hashes"      => json_decode(file_get_contents("/tmp/payload.json"), true),
              "signature"   => base64_encode(file_get_contents("/tmp/payload.sig")),
              "certificate" => file_get_contents($argv[2]),
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          ' "$STAGE" /tmp/${{ env.APP_ID }}.crt
          echo "App signed: $(php -r 'echo count(json_decode(file_get_contents($argv[1]), true)["hashes"]);' "$STAGE/appinfo/signature.json") files"

      - name: Create release tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf ${{ github.workspace }}/${{ env.APP_ID }}-${VERSION}.tar.gz -C /tmp/build ${{ env.APP_ID }}

      - name: Sign tarball and prepare release metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARBALL="${{ env.APP_ID }}-${VERSION}.tar.gz"
          SIGNATURE=$(openssl dgst -sha512 -sign /tmp/${{ env.APP_ID }}.key "$TARBALL" | openssl base64 -A)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT
          echo "signature=${SIGNATURE}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.meta.outputs.tarball }}

      - name: Publish to Nextcloud App Store
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${{ steps.meta.outputs.tarball }}"
          RESPONSE=$(curl -s -o /tmp/store_response.json -w "%{http_code}" \
            -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token ${{ secrets.NEXTCLOUD_STORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"download\": \"${DOWNLOAD_URL}\", \"signature\": \"${{ steps.meta.outputs.signature }}\"}")
          echo "Store API response (HTTP ${RESPONSE}):"
          cat /tmp/store_response.json
          if [[ "$RESPONSE" != "2"* ]]; then
            echo "::error::App Store publish failed with HTTP ${RESPONSE}"
            exit 1
          fi
